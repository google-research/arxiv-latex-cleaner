name: Create a GitHub and PyPI release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Create a GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          FULL_REF: ${{ github.ref }}
        run: |
          gh release create "${TAG_NAME}" \
            --title "Release ${FULL_REF}" \
            --notes "${FULL_REF} release of \`arxiv_latex_cleaner\`."
  deploy:
    name: Create a PyPI Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel twine
      - name: Build
        run: |
          python setup.py sdist bdist_wheel
      - name: Authenticate to Google Cloud (OSS Exit Gate)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Clean up failed staging attempt for this exact version (if any)
        run: |
          python3 - <<'PY'
          import email, glob, re, subprocess, tarfile, zipfile
          seen = set()
          for f in sorted(glob.glob("dist/**/*.whl", recursive=True) + glob.glob("dist/**/*.tar.gz", recursive=True)):
            try:
              if f.endswith(".whl"):
                with zipfile.ZipFile(f) as zf:
                  meta = [n for n in zf.namelist() if n.endswith(".dist-info/METADATA")][0]
                  msg = email.message_from_bytes(zf.read(meta))
              else:
                with tarfile.open(f) as tf:
                  info = [m for m in tf.getmembers() if m.name.endswith("/PKG-INFO") or m.name == "PKG-INFO"][0]
                  msg = email.message_from_bytes(tf.extractfile(info).read())
              pkg = re.sub(r"[-_.]+", "-", msg["Name"].strip()).lower()
              ver = msg["Version"].strip()
            except Exception:
              continue
            if (pkg, ver) in seen:
              continue
            seen.add((pkg, ver))
            if subprocess.run([
                "gcloud", "artifacts", "versions", "describe", ver,
                f"--package={pkg}", "--project=oss-exit-gate-prod", "--location=us", "--repository=arxiv-latex-cleaner--pypi"
            ], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0:
              subprocess.run([
                  "gcloud", "artifacts", "versions", "delete", ver,
                  f"--package={pkg}", "--project=oss-exit-gate-prod", "--location=us", "--repository=arxiv-latex-cleaner--pypi", "--quiet"
              ], check=False)
          PY

      - name: Publish via OSS Exit Gate
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          TWINE_PASSWORD="$(gcloud auth print-access-token)"
          echo "::add-mask::${TWINE_PASSWORD}"
          python -m twine upload \
            --repository-url "https://us-python.pkg.dev/oss-exit-gate-prod/arxiv-latex-cleaner--pypi/" \
            -u oauth2accesstoken \
            -p "${TWINE_PASSWORD}" \
            dist/*
          python3 - dist/* <<'PY'
          import email, json, re, sys, tarfile, zipfile
          pairs = set()
          for path in sys.argv[1:]:
            if path.endswith(".whl"):
              with zipfile.ZipFile(path) as zf:
                for name in zf.namelist():
                  if name.endswith(".dist-info/METADATA"):
                    msg = email.message_from_bytes(zf.read(name))
                    pkg = re.sub(r"[-_.]+", "-", msg["Name"].strip()).lower()
                    pairs.add((pkg, msg["Version"].strip()))
                    break
            elif path.endswith(".tar.gz"):
              with tarfile.open(path, "r:gz") as tf:
                for member in tf.getmembers():
                  if member.name.endswith("/PKG-INFO") and member.name.count("/") == 1:
                    f = tf.extractfile(member)
                    if f is not None:
                      msg = email.message_from_bytes(f.read())
                      pkg = re.sub(r"[-_.]+", "-", msg["Name"].strip()).lower()
                      pairs.add((pkg, msg["Version"].strip()))
                    break
          if not pairs:
            raise SystemExit("ERROR: No .whl/.tar.gz package metadata found for manifest.json")
          manifest = {
              "publish_all": False,
              "publishing_groups": [{
                  "packages": [{"name": pkg, "version": ver} for pkg, ver in sorted(pairs)]
              }],
          }
          with open("manifest.json", "w", encoding="utf-8") as fh:
            json.dump(manifest, fh, indent=2)
            fh.write("\n")
          PY
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/arxiv-latex-cleaner/pypi/manifests/manifest-${RUN_ID}-${RUN_ATTEMPT}.json"
